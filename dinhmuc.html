<style>
  .handsontable { font-size: 10.5px; font-family: inherit; }

  /* Ô lấy từ hệ thống: khóa + làm mờ */

  .dm-sep  { background: #FAEEDA !important; color: #854F0B !important; font-weight: 600; }

  .dm-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }

               padding:8px 12px; font-size:12.5px; color:var(--red-text); margin-bottom:10px; }

<body>

<div id="topbar"></div>

<div class="container">

  <div class="dm-bar">
    <span style="font-size:15px;font-weight:500"><i class="ti ti-table"></i> Tạo định mức</span>

  <div class="dm-legend">
    <span><span class="dm-sw" style="background:#faf9f6"></span> Lấy từ hệ thống · khóa</span>
    <span><span class="dm-sw" style="background:#ffffff"></span> Nhập được</span>
    <span><span class="dm-sw" style="background:#F1EFE8"></span> Chờ HS code / C/O / đơn giá</span>
    <span><span class="dm-sw" style="background:#FCEBEB"></span> Trùng mã hoặc lệch giá</span>

  </div>

</div>

<div id="toast" class="toast"></div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { isAdmin, isLoggedIn, canMakeNorm, onAuthChange, logout, nickname } from "./js/auth.js";
import { initTopbar } from "./js/topbar.js";
import { showToast } from "./js/utils.js";
import { collection, getDocs, doc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

initTopbar("dinhmuc");

/* ================= TRẠNG THÁI ================= */
let allShipments = [];      // toàn bộ lô đã tải
let declMap      = {};      // { shipmentId: { lines:[...] } } đã lưu trên Firestore
let rows         = [];       // dữ liệu đang hiển thị trên bảng (gồm dòng ngăn + dòng hàng)
let hot          = null;
const dirty      = new Set(); // các shipmentId có thay đổi chưa lưu
let loaded       = false;

/* ================= TIỆN ÍCH ================= */
function ddmm(iso) {
  if (!iso) return "";
  const p = String(iso).split("-");
  return p.length === 3 ? `${p[2]}-${p[1]}` : String(iso);
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isoOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
// Tháng của lô = tháng ĐƯỢC GÁN (period). Không có period thì mới lấy theo ngày xuất.
function periodOf(s) { return s.period || (shipDateOf(s) || "").slice(0,7); }
// Ngày làm việc cuối cùng của tháng (Thứ 7 vẫn làm, Chủ nhật nghỉ)
function lastWorkDayOfMonth(period) {
  if (!period || period.length < 7) return null;
  const d = new Date(+period.slice(0,4), +period.slice(5,7), 0);   // ngày cuối tháng
  if (isNaN(d)) return null;
  if (d.getDay() === 0) d.setDate(d.getDate() - 1);
  return d;
}
// Hạn tạo định mức = mốc - 1 ngày; nếu ra Chủ nhật thì lùi thêm 1 ngày.
// Mốc = ngày đóng hàng, NHƯNG không được trễ hơn ngày làm việc cuối của tháng được gán.
// (Lô gán tháng 8 mà đóng hàng 03-09 thì mốc là ngày làm việc cuối tháng 8.)
function deadlineISO(s) {
  const lwd = lastWorkDayOfMonth(periodOf(s));
  let st = s.stuffingDate ? new Date(s.stuffingDate + "T00:00:00") : null;
  if (st && isNaN(st)) st = null;
  const ref = (st && lwd) ? (st < lwd ? st : lwd) : (st || lwd);
  if (!ref) return null;
  const d = new Date(ref.getTime());
  d.setDate(d.getDate() - 1);
  if (d.getDay() === 0) d.setDate(d.getDate() - 1);
  return isoOf(d);
}
function daysBetween(fromISO, toISO) {
  const a = new Date(fromISO + "T00:00:00"), b = new Date(toISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
// Ngày dùng để xếp lô và lọc tháng
function shipDateOf(s) { return s.stuffingDate || s.shipDate || s.etd || ""; }
// Khóa nhận dạng 1 dòng hàng trong lô: Đơn hàng + Mã hàng
function lineKey(o) {
  return `${String(o.index || "").trim()}|${String(o.items || "").trim()}`;
}
function num(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = parseFloat(String(v).replace(/,/g, ""));
  return isNaN(n) ? null : n;
}
// Lô đủ điều kiện tạo định mức: MỌI dòng hàng phải có HS code + C/O form + đơn giá
function isEligible(s) {
  const os = s.orders || [];
  if (!os.length) return false;
  return os.every(o => String(o.hsCode || "").trim() && String(o.coForm || "").trim() && (num(o.unitPrice) || 0) > 0);
}

/* ================= CỘT BẢNG ================= */
const DM_COLS = [
  { data:"date",      title:"Ngày xuất",      width: 60 },
  { data:"cust",      title:"Khách hàng",     width:100 },
  { data:"contract",  title:"Hợp đồng",       width: 80 },
  { data:"index",     title:"Đơn hàng",       width: 85 },
  { data:"items",     title:"Mã hàng",        width:175 },
  { data:"qty",       title:"SL",             width: 50, className:"htRight" },
  { data:"ctns",      title:"Th",             width: 36, className:"htRight" },
  { data:"hs",        title:"HS",             width: 54, className:"htRight" },
  { data:"co",        title:"C/O",            width: 42 },
  { data:"price",     title:"Giá GC",         width: 46, className:"htRight" },
  // "Tên hàng trên INV" = 2 cột, tổng bề rộng giữ tỉ lệ 40/60 như anh nói
  { data:"invName1",  title:"Tên INV (1)",    width: 82 },
  { data:"invName2",  title:"Tên INV (2)",    width:125 },
  { data:"declCode",  title:"Mã khai báo HQ", width:190 },
  { data:"declPrice", title:"Giá KB",         width: 54, className:"htRight" },
  { data:"deadline",  title:"Hạn ĐM",         width: 56 },
  { data:"note",      title:"Ghi chú",        width:140 },
];
const EDITABLE = ["invName1","invName2","declCode","declPrice","note"];

/* ================= TẢI DỮ LIỆU ================= */
async function loadAll() {
  const [shipSnap, declSnap] = await Promise.all([
    getDocs(collection(db, "shipments")),
    getDocs(collection(db, "declarations")),
  ]);
  allShipments = shipSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  declMap = {};
  declSnap.docs.forEach(d => { declMap[d.id] = d.data() || {}; });
  loaded = true;
  buildMonthList();
  rebuild();
}

function buildMonthList() {
  const sel = document.getElementById("dm-month");
  const set = new Set();
  allShipments.forEach(s => { const p = periodOf(s); if (p && p.length >= 7) set.add(p); });
  const cur = todayISO().slice(0,7);
  set.add(cur);
  const months = [...set].sort().reverse();
  const keep = sel.value && months.includes(sel.value) ? sel.value : cur;
  sel.innerHTML = months.map(m => {
    const [y, mo] = m.split("-");
    return `<option value="${m}" ${m===keep?"selected":""}>Tháng ${mo}/${y}</option>`;
  }).join("");
}

/* ================= DỰNG DÒNG ================= */
function rebuild() {
  const month = document.getElementById("dm-month").value;
  const list = allShipments
    .filter(s => periodOf(s) === month)
    .sort((a,b) => (shipDateOf(a) || "9999").localeCompare(shipDateOf(b) || "9999"));

  rows = [];
  list.forEach(s => {
    const orders = s.orders || [];
    if (!orders.length) return;
    const elig = isEligible(s);
    const dl = deadlineISO(s);
    const saved = declMap[s.id] || {};
    const savedLines = {};
    (saved.lines || []).forEach(l => { if (l && l.k) savedLines[l.k] = l; });

    const totQty  = orders.reduce((t,o) => t + (num(o.qty)  || 0), 0);
    const totCtns = orders.reduce((t,o) => t + (num(o.ctns) || 0), 0);

    rows.push({
      _t:"sep", _sid:s.id, _elig:elig, _dl:dl,
      date: ddmm(shipDateOf(s)),
      cust: orders[0]?.customer || "",
      contract: s.container || "",
      index: s.invoiceNo ? "INV " + s.invoiceNo : "(chưa có INV)",
      items: [s.eta ? "ETA " + ddmm(s.eta) : "", s.vessel || ""].filter(Boolean).join(" · "),
      qty: totQty || "", ctns: totCtns || "",
      hs:"", co:"", price:"", invName1:"", invName2:"", declCode:"", declPrice:"",
      deadline: dl ? ddmm(dl) : "", note:"",
    });

    orders.forEach((o, i) => {
      const k = lineKey(o);
      const sv = savedLines[k] || {};
      rows.push({
        _t:"line", _sid:s.id, _key:k, _first:(i===0), _elig:elig, _dl:dl,
        date: i===0 ? ddmm(shipDateOf(s)) : "",
        cust: i===0 ? (o.customer || "") : "",
        contract: o.contract || "",
        index: o.index || "",
        items: o.items || "",
        qty: num(o.qty) ?? "",
        ctns: num(o.ctns) ?? "",
        hs: o.hsCode || "",
        co: o.coForm || "",
        price: num(o.unitPrice) ?? "",
        invName1: sv.invName1 || "",
        invName2: sv.invName2 || sv.invName || "",
        declCode: sv.declCode || "",
        declPrice: (sv.declPrice === 0 || sv.declPrice) ? sv.declPrice : "",
        deadline: dl ? ddmm(dl) : "",
        note: sv.note || "",
      });
    });
  });

  recompute();
  renderGrid();
  updateHeader();
}

/* ================= SUY RA MÃ KẾ THỪA + CẢNH BÁO ================= */
function recompute() {
  const bySid = {};
  rows.forEach(r => { if (r._t === "line") (bySid[r._sid] = bySid[r._sid] || []).push(r); });

  Object.values(bySid).forEach(list => {
    let curCode = "", curPrice = "";
    const explicitCount = {}, firstPrice = {};

    list.forEach(r => {
      const c = String(r.declCode || "").trim();
      r._warn = "";
      if (c) {
        curCode = c;
        curPrice = r.declPrice;
        explicitCount[c] = (explicitCount[c] || 0) + 1;
        const p = String(num(r.declPrice) ?? "");
        if (firstPrice[c] === undefined) firstPrice[c] = p;
        else if (firstPrice[c] !== p) r._warnPrice = true;
      }
      r._eff      = c || curCode;
      r._effPrice = c ? r.declPrice : curPrice;
      r._inh      = !c && !!curCode;
    });

    list.forEach(r => {
      const c = String(r.declCode || "").trim();
      if (!c) return;
      if (explicitCount[c] > 1) r._warn = "dup";
      else if (r._warnPrice) r._warn = "price";
      r._warnPrice = false;
    });
  });
}

// 1 lô coi là "đã tạo định mức" khi: đủ điều kiện + mọi dòng có mã (kể cả kế thừa) + mọi mã có giá
function shipmentDone(sid) {
  const list = rows.filter(r => r._t === "line" && r._sid === sid);
  if (!list.length) return false;
  if (!list[0]._elig) return false;
  return list.every(r => String(r._eff || "").trim() && (num(r._effPrice) || 0) > 0);
}

/* ================= BẢNG ================= */
function renderGrid() {
  const el = document.getElementById("dm-grid");
  const canNorm = canMakeNorm();
  const admin = isAdmin();

  if (hot) { hot.destroy(); hot = null; }
  if (!rows.length) {
    el.innerHTML = `<p style="color:var(--text-muted);font-size:13px;padding:16px">Tháng này chưa có lô hàng nào có đơn hàng.</p>`;
    return;
  }
  el.innerHTML = "";

  hot = new Handsontable(el, {
    data: rows,
    columns: DM_COLS.map(c => ({ ...c })),
    colHeaders: DM_COLS.map(c => c.title),
    rowHeaders: false,
    height: Math.max(320, window.innerHeight - 240),
    width: "100%",
    stretchH: "none",
    fixedColumnsStart: 5,
    manualColumnResize: true,
    fillHandle: { direction: "vertical", autoInsertRow: false },
    outsideClickDeselects: false,
    licenseKey: "non-commercial-and-evaluation",

    cells(row, col) {
      const r = rows[row];
      const key = DM_COLS[col]?.data;
      const p = {};
      if (!r) return p;

      if (r._t === "sep") {
        p.readOnly = true;
        p.className = (key === "qty" || key === "ctns") ? "dm-sep-num" : "dm-sep";
        if (key === "declCode") p.renderer = sepStatusRenderer;
        return p;
      }

      let editable = false;
      if (key === "invName1" || key === "invName2") editable = admin;
      else if (key === "declCode" || key === "declPrice") editable = canNorm && r._elig;
      else if (key === "note") editable = canNorm;

      p.readOnly = !editable;
      if (EDITABLE.includes(key)) {
        if (editable) p.className = "dm-edit";
        else if ((key === "declCode" || key === "declPrice") && !r._elig) p.className = "dm-wait";
        else p.className = "dm-ro";
      } else {
        p.className = "dm-ro";
      }
      if (key === "qty" || key === "ctns" || key === "price") p.className += " htRight";
      if (key === "declPrice") p.className += " htRight";
      if (r._first) p.className += " dm-top";

      if (key === "declCode")  p.renderer = codeRenderer;
      if (key === "declPrice") p.renderer = priceRenderer;
      if (key === "deadline")  p.renderer = deadlineRenderer;
      return p;
    },

    afterChange(changes, source) {
      if (!changes || source === "loadData") return;
      let touched = false;
      changes.forEach(([row, prop, oldV, newV]) => {
        if (oldV === newV) return;
        const r = rows[row];
        if (!r || r._t !== "line") return;
        if (prop === "declPrice") {
          const n = num(newV);
          r.declPrice = n === null ? "" : Math.round(n * 100) / 100;
        } else if (typeof r[prop] === "string" || r[prop] === "") {
          r[prop] = newV === null ? "" : String(newV).trim();
        }
        dirty.add(r._sid);
        touched = true;
      });
      if (touched) { recompute(); hot.render(); updateHeader(); }
    },
  });
}

function sepStatusRenderer(inst, td, row) {
  const r = rows[row];
  td.className = "dm-sep";
  if (!r) { td.innerHTML = ""; return; }
  if (!r._elig) { td.innerHTML = "Chưa đủ HS code / C/O / đơn giá"; return; }
  if (shipmentDone(r._sid)) { td.innerHTML = "Đã tạo định mức"; return; }
  td.innerHTML = "Còn thiếu mã hoặc giá khai báo";
}

function codeRenderer(inst, td, row, col, prop, value) {
  Handsontable.renderers.TextRenderer.apply(this, arguments);
  const r = rows[row];
  if (!r || r._t !== "line") return;
  if (!String(value || "").trim() && r._inh) {
    td.innerHTML = "&#8627; " + r._eff;
    td.classList.add("dm-inh");
  }
  if (r._warn === "dup") {
    td.classList.add("dm-bad");
    td.title = "Mã này đã được khai ở một nhóm khác trong cùng lô. Nếu 2 nhóm dùng chung mã thì để trống dòng dưới.";
  } else if (r._warn === "price") {
    td.classList.add("dm-bad");
    td.title = "Cùng mã khai báo nhưng giá khai báo khác nhau.";
  }
}

function priceRenderer(inst, td, row, col, prop, value) {
  Handsontable.renderers.TextRenderer.apply(this, arguments);
  const r = rows[row];
  if (!r || r._t !== "line") return;
  const v = num(value);
  if (v !== null) td.innerHTML = v.toFixed(2);
  else if (r._inh && num(r._effPrice) !== null) {
    td.innerHTML = "&#8627; " + num(r._effPrice).toFixed(2);
    td.classList.add("dm-inh");
  }
  if (r._warn === "price") td.classList.add("dm-bad");
}

function deadlineRenderer(inst, td, row, col, prop, value) {
  Handsontable.renderers.TextRenderer.apply(this, arguments);
  const r = rows[row];
  if (!r || !r._dl) return;
  if (r._t === "line" && (!r._elig || shipmentDone(r._sid))) {
    if (shipmentDone(r._sid)) td.classList.add("dm-okgr");
    return;
  }
  const left = daysBetween(todayISO(), r._dl);
  if (left <= 0) td.classList.add("dm-late");
  else if (left <= 2) td.classList.add("dm-soon");
}

/* ================= THANH TRÊN ================= */
function updateHeader() {
  const sids = [...new Set(rows.filter(r => r._t === "line").map(r => r._sid))];
  const eligible = sids.filter(sid => rows.find(r => r._t === "line" && r._sid === sid)._elig);
  const done = eligible.filter(shipmentDone);
  document.getElementById("dm-stat").textContent =
    `Đã tạo ${done.length}/${eligible.length} lô đủ điều kiện` +
    (sids.length > eligible.length ? ` · ${sids.length - eligible.length} lô chờ HS/C/O/giá` : "");

  const today = todayISO();
  const late = eligible.filter(sid => !done.includes(sid)).map(sid => {
    const r = rows.find(x => x._t === "line" && x._sid === sid);
    const s = allShipments.find(x => x.id === sid);
    return { sid, dl: r._dl, left: r._dl ? daysBetween(today, r._dl) : 999,
             label: `${(s?.orders||[])[0]?.customer || ""} ${s?.invoiceNo || ""}`.trim() };
  }).filter(x => x.left <= 2).sort((a,b) => a.left - b.left);

  const pill = document.getElementById("dm-late-pill");
  const box  = document.getElementById("dm-warn-box");
  if (late.length) {
    pill.style.display = ""; pill.innerHTML = `<i class="ti ti-alert-triangle"></i> ${late.length} lô tới hạn`;
    box.style.display = "";
    box.innerHTML = `<b style="font-weight:500">Cần tạo định mức:</b> ` + late.map(x => {
      const t = x.left < 0 ? `quá ${-x.left} ngày` : x.left === 0 ? "hôm nay" : `còn ${x.left} ngày`;
      return `${x.label || "(lô chưa có INV)"} — hạn ${ddmm(x.dl)} (${t})`;
    }).join(" · ");
  } else {
    pill.style.display = "none"; box.style.display = "none";
  }

  const dd = document.getElementById("dm-dirty");
  dd.style.display = dirty.size ? "" : "none";
}

/* ================= LƯU ================= */
async function save() {
  if (!dirty.size) { showToast("Không có thay đổi nào để lưu."); return; }
  const btn = document.getElementById("dm-save");
  btn.disabled = true; btn.innerHTML = `<i class="ti ti-loader"></i> Đang lưu...`;
  try {
    const batch = writeBatch(db);
    const who = nickname() || "";
    const stamp = new Date().toISOString();
    dirty.forEach(sid => {
      const s = allShipments.find(x => x.id === sid);
      const lines = rows.filter(r => r._t === "line" && r._sid === sid).map(r => {
        const p = num(r.declPrice);
        return {
          k: r._key,
          declCode: String(r.declCode || "").trim(),
          declPrice: p === null ? "" : Math.round(p * 100) / 100,
          invName1: String(r.invName1 || "").trim(),
          invName2: String(r.invName2 || "").trim(),
          note: String(r.note || "").trim(),
        };
      }).filter(l => l.declCode || l.declPrice !== "" || l.invName1 || l.invName2 || l.note);
      const payload = {
        shipmentId: sid,
        invoiceNo: s?.invoiceNo || null,
        stuffingDate: s?.stuffingDate || null,
        lines,
        updatedAt: stamp,
        updatedBy: who,
      };
      batch.set(doc(db, "declarations", sid), payload);
      declMap[sid] = payload;
    });
    await batch.commit();
    dirty.clear();
    updateHeader();
    showToast("Đã lưu!");
  } catch (e) {
    alert("Lưu thất bại: " + (e.message || e) + "\n\nDữ liệu trên bảng vẫn còn, anh thử Lưu lại.");
  } finally {
    btn.disabled = false; btn.innerHTML = `<i class="ti ti-device-floppy"></i> Lưu`;
  }
}

/* ================= ĐIỀN NHANH TÊN INV ================= */
// Mẫu: Mã hàng(Đơn hàng) — thay cho công thức =+H&"("&G&")" trong Excel
function quickFill() {
  if (!isAdmin()) return;
  let sel = null;
  const ranges = hot?.getSelected();
  if (ranges && ranges.length) {
    const [r1,, r2] = ranges[0];
    sel = [Math.min(r1, r2), Math.max(r1, r2)];
  }
  const target = rows.map((r, i) => ({ r, i }))
    .filter(({ r, i }) => r._t === "line" && !String(r.invName2 || "").trim()
                          && String(r.items || "").trim()
                          && (!sel || (i >= sel[0] && i <= sel[1])));
  if (!target.length) {
    alert(sel ? "Trong vùng đang chọn không có ô Tên INV (2) nào đang trống."
              : "Không còn ô Tên INV (2) nào đang trống.");
    return;
  }
  const scope = sel ? "trong vùng đang chọn" : "của cả tháng";
  if (!confirm(`Điền ${target.length} ô "Tên INV (2)" ${scope} theo mẫu Mã hàng(Đơn hàng)?\n\nVí dụ: ${String(target[0].r.items).trim()}(${String(target[0].r.index||"").trim()})\n\nCác ô đã có nội dung sẽ KHÔNG bị ghi đè. Cột Tên INV (1) không bị ảnh hưởng.`)) return;
  target.forEach(({ r }) => {
    const it = String(r.items || "").trim();
    const ix = String(r.index || "").trim();
    r.invName2 = ix ? `${it}(${ix})` : it;
    dirty.add(r._sid);
  });
  hot.render();
  updateHeader();
  showToast(`Đã điền ${target.length} ô.`);
}

/* ================= SỰ KIỆN ================= */
document.getElementById("dm-month").addEventListener("change", () => {
  if (dirty.size && !confirm("Còn thay đổi chưa lưu. Đổi tháng sẽ mất phần chưa lưu. Tiếp tục?")) {
    buildMonthList(); return;
  }
  dirty.clear();
  rebuild();
});
document.getElementById("dm-save").addEventListener("click", save);
document.getElementById("dm-fill").addEventListener("click", quickFill);
document.getElementById("dm-reload").addEventListener("click", async () => {
  if (dirty.size && !confirm("Còn thay đổi chưa lưu. Tải lại sẽ mất phần chưa lưu. Tiếp tục?")) return;
  dirty.clear();
  await loadAll();
  showToast("Đã tải lại.");
});
document.getElementById("btn-login-toggle")?.addEventListener("click", async () => {
  if (isLoggedIn()) { await logout(); location.href = "index.html"; }
  else location.href = "index.html";
});
window.addEventListener("beforeunload", e => {
  if (dirty.size) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("resize", () => {
  if (hot) hot.updateSettings({ height: Math.max(320, window.innerHeight - 240) });
});

/* ================= VÀO TRANG ================= */
onAuthChange(async user => {
  if (!user) { location.href = "index.html"; return; }
  if (!canMakeNorm()) {
    alert("Bạn không có quyền vào trang Tạo định mức.");
    location.href = "index.html";
    return;
  }
  document.getElementById("dm-fill").style.display = isAdmin() ? "" : "none";
  const info = document.getElementById("dm-info-box");
  if (!isAdmin()) {
    info.style.display = "";
    info.innerHTML = `Anh/chị nhập <b style="font-weight:500">Mã khai báo HQ</b>, <b style="font-weight:500">Giá KB</b> và <b style="font-weight:500">Ghi chú</b>. Mã chỉ cần gõ ở dòng đầu của nhóm, các dòng dưới để trống là dùng chung mã đó. Các cột màu xám lấy từ hệ thống, muốn sửa thì nhờ bộ phận XNK sửa trong lô hàng.`;
  }
  if (!loaded) {
    document.getElementById("dm-grid").innerHTML =
      `<p style="color:var(--text-muted);font-size:13px;padding:16px">Đang tải dữ liệu...</p>`;
    try { await loadAll(); }
    catch (e) { document.getElementById("dm-grid").innerHTML =
      `<p style="color:var(--red-text);font-size:13px;padding:16px">Không tải được dữ liệu: ${e.message || e}</p>`; }
  } else {
    renderGrid(); updateHeader();
  }
});
</script>
